<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Top 1 Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
        }

        .gold-text {
            background: linear-gradient(to right, #FFD700, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 10px rgba(255, 215, 0, 0.3);
        }

        #entrance-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        #entrance-alert.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .epic-glow {
            background: linear-gradient(135deg, rgba(20,20,30,0.95), rgba(10,10,15,0.95));
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.5), inset 0 0 40px rgba(255, 215, 0, 0.3);
            border: 3px solid rgba(255, 215, 0, 0.6);
            transition: all 0.5s ease;
        }

        .epic-glow.new-leader {
            box-shadow: 0 0 80px rgba(74, 222, 128, 0.5), inset 0 0 40px rgba(74, 222, 128, 0.3);
            border-color: rgba(74, 222, 128, 0.6);
        }

        .rays {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            background: repeating-conic-gradient(from 0deg, transparent 0deg 15deg, rgba(255, 215, 0, 0.08) 15deg 30deg);
            transform: translate(-50%, -50%);
            animation: spin-rays 30s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes spin-rays {
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .crown-icon {
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(-5deg); }
        }
    </style>
</head>
<body class="w-screen h-screen relative">

    <!-- Статус подключения (Офлайн / Онлайн) -->
    <div id="status-overlay" class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity duration-700 z-40">
        <div class="bg-black/80 px-8 py-5 rounded-3xl border border-white/10 flex flex-col items-center shadow-2xl">
            <div id="status-dot" class="w-5 h-5 rounded-full bg-yellow-500 animate-pulse mb-3 shadow-[0_0_15px_currentColor]"></div>
            <h3 class="text-2xl font-bold text-gray-200 tracking-widest uppercase" id="status-text">ПОДКЛЮЧЕНИЕ...</h3>
            <p class="text-gray-500 text-sm mt-2" id="status-subtext">Связь с сервером</p>
        </div>
    </div>

    <!-- Анимация Входа / Нового Лидера -->
    <div id="entrance-alert" class="w-[800px] glass-panel epic-glow p-12 rounded-[2.5rem] flex flex-col items-center justify-center relative z-50 overflow-hidden">
        <div class="rays"></div>
        
        <div class="text-7xl mb-4 crown-icon z-10 drop-shadow-[0_0_15px_rgba(255,215,0,0.8)]">👑</div>
        
        <div class="relative avatar-container w-48 h-48 rounded-full border-[6px] border-yellow-400 overflow-hidden mb-6 shadow-[0_0_40px_rgba(255,215,0,0.6)] z-10 bg-gray-900 transition-colors duration-500" id="avatar-container">
            <img id="entrance-avatar" src="" alt="Avatar" class="w-full h-full object-cover">
        </div>
        
        <!-- Заголовок, который будет меняться -->
        <h2 id="entrance-title" class="text-3xl text-yellow-200 font-bold mb-2 uppercase tracking-widest drop-shadow-md z-10 transition-colors">Внимание! На стрим зашел</h2>
        
        <h1 class="text-7xl font-extrabold gold-text mb-4 z-10 drop-shadow-xl" id="entrance-username">Username</h1>
        
        <div class="text-2xl font-bold text-white mb-6 z-10 flex items-center gap-2 bg-black/40 px-6 py-2 rounded-2xl border border-white/10 backdrop-blur-md">
            Отправил: <span id="entrance-coins" class="text-yellow-400 text-3xl mx-1 drop-shadow-md">0</span> 
            <svg class="w-7 h-7 text-yellow-400 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 14a6 6 0 110-12 6 6 0 010 12zm0-9a1 1 0 00-1 1v2.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 10.586V8a1 1 0 00-1-1z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
        </div>

        <div id="entrance-badge" class="bg-gradient-to-r from-yellow-600/60 via-yellow-400/60 to-yellow-600/60 px-12 py-5 rounded-full border-2 border-yellow-400/80 shadow-[0_0_40px_rgba(255,215,0,0.6)] z-10 transform hover:scale-105 transition-all">
            <span id="entrance-badge-text" class="text-yellow-200 font-black text-4xl tracking-widest uppercase drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] text-shadow-xl">ТОП 1 ДАРИТЕЛЬ</span>
        </div>
    </div>

    <script>
        // Получаем имя стримера из ссылки безопасно
        const urlParams = new URLSearchParams(window.location.search);
        const targetStreamer = urlParams.get('user')?.replace('@', '').trim().toLowerCase();

        const statusOverlay = document.getElementById('status-overlay');
        const statusText = document.getElementById('status-text');
        const statusSubtext = document.getElementById('status-subtext');
        const statusDot = document.getElementById('status-dot');

        if (!targetStreamer) {
            statusText.textContent = "ОШИБКА НАСТРОЙКИ";
            statusSubtext.textContent = "Укажите логин стримера: ?user=ЛОГИН";
            statusDot.className = "w-5 h-5 rounded-full bg-red-600 mb-3 shadow-[0_0_15px_red]";
            throw new Error("Не указан стример");
        }

        statusSubtext.textContent = `Стример: @${targetStreamer}`;

        // === ПОДКЛЮЧЕНИЕ К СЕРВЕРУ (SSE) ===
        // Сервер теперь отправляет данные без буферизации для мгновенной реакции
        const eventSource = new EventSource(`/events?user=${targetStreamer}`);

        eventSource.onopen = () => {
            console.log('✅ Установлена связь с сервером');
        };

        eventSource.onmessage = (event) => {
            console.log("Данные от сервера:", event.data);
            const data = JSON.parse(event.data);
            
            // 1. ОБРАБОТКА СТАТУСА (Онлайн/Офлайн)
            if (data.type === 'status') {
                if (data.online) {
                    // Скрываем плашку офлайна - делаем фон полностью прозрачным
                    statusOverlay.classList.add('opacity-0');
                    setTimeout(() => statusOverlay.style.display = 'none', 700);
                } else {
                    // Показываем плашку "Стрим офлайн"
                    statusOverlay.style.display = 'flex';
                    setTimeout(() => statusOverlay.classList.remove('opacity-0'), 10);
                    statusText.textContent = "СТРИМ ОФЛАЙН";
                    statusSubtext.textContent = `@${targetStreamer} не ведет трансляцию`;
                    statusDot.className = "w-5 h-5 rounded-full bg-gray-500 mb-3 shadow-none";
                }
            }

            // 2. ОБРАБОТКА АНИМАЦИИ ВХОДА ИЛИ НОВОГО РЕКОРДА
            if (data.type === 'entrance') {
                playEntranceAnimation(data.username, data.avatar, data.coins, data.isNewLeader, data.isTest);
            }
        };

        eventSource.onerror = (err) => {
            console.error("Ошибка соединения, переподключение...", err);
            statusOverlay.style.display = 'flex';
            setTimeout(() => statusOverlay.classList.remove('opacity-0'), 10);
            statusText.textContent = "ПОТЕРЯНА СВЯЗЬ С СЕРВЕРОМ";
            statusSubtext.textContent = "Пытаюсь переподключиться...";
            statusDot.className = "w-5 h-5 rounded-full bg-red-600 animate-pulse mb-3 shadow-[0_0_15px_red]";
        };

        // === ГЛАВНАЯ ФУНКЦИЯ АНИМАЦИИ ===
        let isAnimating = false;
        function playEntranceAnimation(username, avatar, coins, isNewLeader, isTest) {
            if (isAnimating) return;
            isAnimating = true;

            const alertBox = document.getElementById('entrance-alert');
            const titleEl = document.getElementById('entrance-title');
            const badgeEl = document.getElementById('entrance-badge');
            const avatarContainer = document.getElementById('avatar-container');
            const badgeText = document.getElementById('entrance-badge-text');
            
            // Меняем дизайн в зависимости от того, побит ли рекорд
            if (isNewLeader) {
                // Дизайн "Новый Король Стрима" (Зеленые и неоновые тона)
                alertBox.classList.add('new-leader');
                titleEl.textContent = "🚨 РЕКОРД ПОБИТ 🚨";
                titleEl.className = "text-4xl text-green-400 font-black mb-2 uppercase tracking-widest drop-shadow-[0_0_10px_rgba(74,222,128,0.8)] z-10 animate-pulse";
                badgeEl.className = "bg-gradient-to-r from-green-600/60 via-green-400/60 to-green-600/60 px-12 py-5 rounded-full border-2 border-green-400/80 shadow-[0_0_40px_rgba(74,222,128,0.6)] z-10 transform scale-110 transition-all";
                avatarContainer.className = "relative avatar-container w-48 h-48 rounded-full border-[6px] border-green-400 overflow-hidden mb-6 shadow-[0_0_40px_rgba(74,222,128,0.6)] z-10 bg-gray-900 transition-colors duration-500";
                badgeText.className = "text-green-100 font-black text-4xl tracking-widest uppercase drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] text-shadow-xl";
                badgeText.textContent = "НОВЫЙ КОРОЛЬ СТРИМА";
            } else {
                // Стандартный дизайн "Топ-1 зашел" (Золотые тона)
                alertBox.classList.remove('new-leader');
                titleEl.textContent = isTest ? "ТЕСТОВЫЙ ЗАПУСК" : "Внимание! На стрим зашел";
                titleEl.className = "text-3xl text-yellow-200 font-bold mb-2 uppercase tracking-widest drop-shadow-md z-10 transition-colors";
                badgeEl.className = "bg-gradient-to-r from-yellow-600/60 via-yellow-400/60 to-yellow-600/60 px-12 py-5 rounded-full border-2 border-yellow-400/80 shadow-[0_0_40px_rgba(255,215,0,0.6)] z-10 transform hover:scale-105 transition-all";
                avatarContainer.className = "relative avatar-container w-48 h-48 rounded-full border-[6px] border-yellow-400 overflow-hidden mb-6 shadow-[0_0_40px_rgba(255,215,0,0.6)] z-10 bg-gray-900 transition-colors duration-500";
                badgeText.className = "text-yellow-200 font-black text-4xl tracking-widest uppercase drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] text-shadow-xl";
                badgeText.textContent = "ТОП 1 ДАРИТЕЛЬ";
            }
            
            // Подставляем данные пользователя
            document.getElementById('entrance-username').textContent = username;
            document.getElementById('entrance-avatar').src = avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + username;
            document.getElementById('entrance-coins').textContent = (coins || 0).toLocaleString();

            // Проигрываем звук
            const entranceSound = new Audio('https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg');
            entranceSound.volume = 0.6;
            entranceSound.play().catch(()=>{});

            // Показываем плашку
            alertBox.classList.add('active');

            // Запускаем конфетти 3 раза подряд для эффекта
            fireConfetti();
            setTimeout(fireConfetti, 500);
            setTimeout(fireConfetti, 1000);

            // Прячем анимацию через 6 секунд и возвращаем флаг в false
            setTimeout(() => {
                alertBox.classList.remove('active');
                setTimeout(() => { isAnimating = false; }, 600); // Ждем пока закончится CSS анимация скрытия
            }, 6000);
        }

        // === ЭФФЕКТ КОНФЕТТИ ===
        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#FFD700', '#FFA500', '#FFFFFF'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#FFD700', '#FFA500', '#FFFFFF'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
